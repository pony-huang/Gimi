name: release-please

# 每次 push 到 main 时运行：机器人扫描上个 release 以来的 Conventional Commits，
# 创建/更新一个 Release PR（含 CHANGELOG.md 新段落与版本号 bump）。
# 维护者合并该 PR 后，机器人自动打 tag 并创建 GitHub Release，
# tag 推送再触发 release.yml 构建 APK 并上传到该 Release。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 注意：默认 GITHUB_TOKEN 创建的 tag/Release 不会再触发其他 workflow（防循环），
      # 因此需要配置 RELEASE_PLEASE_TOKEN（repo 权限的 PAT 或 GitHub App token），
      # 否则合并 Release PR 后 release.yml 不会自动构建。
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
