name: publish-android-release

on:
  # 版本推进方式一：推送 v* 标签（如 git tag v0.2.0 && git push origin v0.2.0）。
  push:
    tags: ['v*']
  # 版本推进方式二：手动触发；version 留空时优先使用 GitHub 最新 tag，
  # 仓库还没有 tag 时回退到 app/build.gradle.kts 中的当前版本号。
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不含 v 前缀；留空则优先使用 GitHub 最新 tag）'
        required: false
        type: string
      prerelease:
        description: '标记为预发布（pre-release）；版本号含 - 时自动视为预发布'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 发布不允许并发，避免重复 tag/Release。
concurrency:
  group: publish-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本来源优先级：手动输入 > 当前标签名（去掉 v 前缀）> GitHub 最新 tag > build.gradle.kts 当前默认版本。
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # 手动触发且未填版本：优先取 GitHub 最新 tag（按语义化版本排序）。
            LATEST_TAG="$(gh api repos/${{ github.repository }}/tags --jq '.[].name' | grep -E '^v?[0-9]' | sort -rV | head -1 || true)"
            if [ -n "$LATEST_TAG" ]; then
              V="${LATEST_TAG#v}"
            else
              V="$(sed -n 's/.*getOrElse("\([^"]*\)").*/\1/p' app/build.gradle.kts | head -1)"
            fi
          fi
          if [ -z "$V" ]; then
            echo "Failed to resolve release version; please provide the version input manually" >&2
            exit 1
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "auto_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "auto_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Release version: $V"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 可选签名：配置了 RELEASE_KEYSTORE_BASE64 等 secret 时用正式密钥库签名，
      # 否则构建脚本回退到 debug 签名（见 app/build.gradle.kts）。
      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          SIGNING_ARGS=""
          if [ -n "$KEYSTORE_PATH" ]; then
            SIGNING_ARGS="-PreleaseStoreFile=$KEYSTORE_PATH -PreleaseStorePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} -PreleaseKeyAlias=${{ secrets.RELEASE_KEY_ALIAS }} -PreleaseKeyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          fi
          ./gradlew app:assembleRelease --stacktrace --no-parallel --max-workers=2 \
            -PreleaseVersionName="${{ steps.version.outputs.value }}" \
            -PreleaseVersionCode="${{ github.run_number }}" \
            $SIGNING_ARGS

      - name: Package artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/${REPO_NAME}-v${VERSION}-${abi}.apk"
          done
          ls -la dist/

      # 发布策略：release-please 合并 Release PR 时，会先打 tag、再用 CHANGELOG.md
      # 创建带分组更新日志的 Release；本工作流由 tag 推送触发，构建完成后：
      #   - 若 Release 已存在 -> 仅上传 APK，保留其更新日志，避免被空正文覆盖；
      #   - 若 Release 不存在（手动打 tag）-> 用 GitHub 自动生成的更新日志创建 Release。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          AUTO_PRERELEASE: ${{ steps.version.outputs.auto_prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          IS_PRERELEASE="false"
          if [ "${{ inputs.prerelease }}" = "true" ] || [ "${AUTO_PRERELEASE}" = "true" ]; then
            IS_PRERELEASE="true"
          fi

          # release-please 先建 tag 再建 Release，正常情况这里已经能看到 Release；
          # 短重试仅兜底处理机器人创建 Release 的微小延迟。
          EXISTS="false"
          for i in $(seq 1 3); do
            if gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              EXISTS="true"
              break
            fi
            sleep 5
          done

          if [ "${EXISTS}" = "true" ]; then
            echo "Release ${TAG} already exists; uploading APKs without changing its notes"
            gh release upload "${TAG}" dist/* --clobber --repo "${{ github.repository }}"
          else
            echo "Release ${TAG} does not exist; creating it with auto-generated notes"
            PRERELEASE_FLAG=""
            if [ "${IS_PRERELEASE}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --generate-notes \
              ${PRERELEASE_FLAG} \
              dist/*
          fi
