name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!release-please--**'
      - '!backup/**'
      - '!dependabot/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
