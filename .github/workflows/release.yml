name: Publish Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本 tag，例如 v0.6.4 或 v0.7.0-rc.1'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check required signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required signing configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}
          fetch-depth: 0
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: python3 .github/scripts/release_tools.py validate --tag "$TAG"
      - name: Resolve immutable commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Validate tag and signing inputs
        run: |
          set -euo pipefail
          python3 .github/scripts/release_tools.py validate --tag "$TAG"
          for name in RELEASE_KEYSTORE_BASE64 ORG_GRADLE_PROJECT_releaseStorePassword ORG_GRADLE_PROJECT_releaseKeyAlias ORG_GRADLE_PROJECT_releaseKeyPassword; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required signing configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing and Android tools
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "ORG_GRADLE_PROJECT_releaseStoreFile=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$RUNNER_TEMP/release-keystore.jks" \
            -storepass:env ORG_GRADLE_PROJECT_releaseStorePassword \
            -alias "$ORG_GRADLE_PROJECT_releaseKeyAlias" -file "$RUNNER_TEMP/release-cert.der"
          echo "RELEASE_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          sdkmanager 'build-tools;36.0.0'
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
      - name: Build all release APKs
        run: |
          ./gradlew :app:assembleRelease :plugins:spotify:assembleRelease \
            :plugins:zhihu:assembleRelease :plugins:xiaohongshu:assembleRelease \
            :plugins:v2ex:assembleRelease :plugins:weibo:assembleRelease \
            --stacktrace --no-parallel --max-workers=2
      - name: Validate and package artifacts
        run: |
          python3 .github/scripts/release_tools.py package \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner"
      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error
      - name: Publish complete draft
        run: python3 .github/scripts/release_tools.py publish --tag "$TAG"
      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release-keystore.jks" "$RUNNER_TEMP/release-cert.der"
