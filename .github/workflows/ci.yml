name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 的新提交取消旧运行，节省 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        timeout-minutes: 15
        # 插件实例只编译，不运行测试；宿主的插件管理与协议测试仍保留。
        run: |
          ./gradlew testDebugUnitTest \
            -x :plugins:zhihu:testDebugUnitTest \
            -x :plugins:spotify:testDebugUnitTest \
            -x :plugins:xiaohongshu:testDebugUnitTest \
            -x :plugins:v2ex:testDebugUnitTest \
            -x :plugins:weibo:testDebugUnitTest \
            --init-script .github/gradle/ci-tests.gradle --max-workers=2 --console=plain --stacktrace

      - name: Assemble debug APK
        timeout-minutes: 10
        # 只打包主 App；插件实例保留源码编译检查。
        run: |
          ./gradlew :app:assembleDebug \
            :plugins:zhihu:compileDebugKotlin :plugins:spotify:compileDebugKotlin \
            :plugins:xiaohongshu:compileDebugKotlin :plugins:v2ex:compileDebugKotlin \
            :plugins:weibo:compileDebugKotlin \
            --max-workers=2 --console=plain --stacktrace

      - name: Lint
        timeout-minutes: 10
        run: ./gradlew :app:lintDebug --max-workers=2 --console=plain --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/TEST-*.xml
            **/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: ignore
